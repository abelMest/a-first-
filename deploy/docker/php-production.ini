; A-FIRST production PHP settings (the base image is also used for development and CI).
pcov.enabled = 0
display_errors = Off
log_errors = On
expose_php = Off
memory_limit = 512M
max_execution_time = 120
upload_max_filesize = 100M
post_max_size = 100M
max_input_vars = 5000
opcache.enable = 1
opcache.memory_consumption = 256
opcache.max_accelerated_files = 20000
; Code never changes inside a running container.
opcache.validate_timestamps = 0
session.cookie_httponly = 1
